<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Crystal Caper 🦊💎 — a tiny Agile Lens adventure</title>
<meta name="description" content="Crystal Caper — a pixel-art platformer with 100% AI-generated assets. Built by Alex Coulombe / Agile Lens." />
<meta property="og:title" content="Crystal Caper — a tiny Agile Lens adventure" />
<meta property="og:description" content="A pixel-art platformer with 100% AI-generated assets. Play free in your browser." />
<meta property="og:image" content="https://ibrews.github.io/crystal-caper/card.png" />
<meta property="og:url" content="https://ibrews.github.io/crystal-caper/" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #0e1320; overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #eaf2ff;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    width: 100%; height: 100%; max-width: 100vw; max-height: 100vh;
    object-fit: contain; background: #6cb8f0; touch-action: none;
  }
  /* On-screen controls (mobile) */
  #pad { position: fixed; inset: 0; pointer-events: none; }
  .btn {
    position: absolute; bottom: 4vh; width: 17vmin; height: 17vmin;
    border-radius: 50%; background: rgba(255,255,255,.14);
    border: 3px solid rgba(255,255,255,.42); display: grid; place-items: center;
    font-weight: 800; font-size: 7vmin; color: rgba(255,255,255,.9);
    pointer-events: auto; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: rgba(255,255,255,.28); }
  #bleft  { left: 4vw; }
  #bright { left: 26vw; }
  #bjump  { right: 5vw; width: 21vmin; height: 21vmin; font-size: 4.4vmin; }
  #credit {
    position: fixed; left: 0; right: 0; bottom: 2px; text-align: center;
    font-size: 11px; color: rgba(255,255,255,.5); pointer-events: auto;
  }
  #credit a { color: rgba(255,255,255,.7); text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { #pad { display: none; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="pad">
  <div class="btn" id="bleft">◀</div>
  <div class="btn" id="bright">▶</div>
  <div class="btn" id="bjump">JUMP</div>
</div>
<div id="credit">Crystal Caper — a tiny <a href="https://agilelens.com" target="_blank" rel="noopener">Agile Lens</a> adventure · art generated with PixelLab</div>

<script>
// ----- Easter egg for the curious -----
console.log("%c🦊 Crystal Caper","font-size:16px;font-weight:bold");
console.log("Built by Alex Coulombe / Agile Lens — agilelens.com. Every sprite was AI-generated with PixelLab. Try the ↑/Space, and look for the signposts.");

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const VIEW_W = canvas.width, VIEW_H = canvas.height;

// ---------- Config (world is y-up, origin bottom-left; flipped at render) ----------
const TILE = 40;
const G = 2500, MOVE = 330, JUMP = 900, BOUNCE = 720, MAXFALL = 1500;
const COYOTE = 0.10, BUFFER = 0.12;
const GEM_SCORE = 100, STOMP_SCORE = 250;

// ---------- Level (matches the iOS LevelData; row = bottom row, h tall) ----------
const LEVEL = {
  widthTiles: 66,
  start: {col: 2, row: 4},
  goal: {col: 60, row: 3},
  platforms: [
    [0,0,14,3],[17,0,11,3],[20,6,4,1],[31,0,12,3],[35,6,3,1],[39,8,3,1],[46,0,20,3],
  ],
  gems: [[8,4],[11,4],[20,7],[21,7],[22,7],[23,7],[36,7],[37,7],[40,10],[41,10],[48,4],[50,4],[52,4],[58,4]],
  enemies: [[22,3,18,27],[36,3,32,42],[52,3,47,58]],
  // sly Agile Lens signposts (col,row,text)
  signs: [[5,3,"AGILE LENS →"],[44,3,"agilelens.com"]],
};

// ---------- Assets ----------
const IMG = {};
const manifest = {
  idle: ["pip_idle_0","pip_idle_1","pip_idle_2","pip_idle_3"],
  run:  ["pip_run_0","pip_run_1","pip_run_2","pip_run_3","pip_run_4","pip_run_5"],
  jump: ["pip_jump_2","pip_jump_4","pip_jump_6"],
  walk: ["grump_walk_0","grump_walk_1","grump_walk_2","grump_walk_3","grump_walk_4","grump_walk_5"],
  tile_surface: ["tile_surface"], tile_fill: ["tile_fill"],
};
const SFX = {};
function loadAll(done) {
  const names = [...new Set(Object.values(manifest).flat())];
  let pending = names.length;
  IMG.anim = {};
  for (const key in manifest) IMG.anim[key] = [];
  const byName = {};
  names.forEach(n => {
    const im = new Image();
    im.onload = im.onerror = () => { if (--pending === 0) wire(); };
    im.src = "assets/" + n + ".png";
    byName[n] = im;
  });
  function wire() {
    for (const key in manifest) IMG.anim[key] = manifest[key].map(n => byName[n]);
    IMG.surface = byName["tile_surface"]; IMG.fill = byName["tile_fill"];
    ["sfx_jump","sfx_gem","sfx_stomp","sfx_hurt","sfx_win"].forEach(s => {
      const a = new Audio("assets/" + s + ".wav"); a.preload = "auto"; SFX[s] = a;
    });
    done();
  }
}
function sfx(name) {
  const a = SFX["sfx_" + name]; if (!a) return;
  try { const c = a.cloneNode(); c.volume = 0.5; c.play().catch(()=>{}); } catch(e){}
}

// ---------- World build ----------
let platforms = [], gems = [], enemies = [], goal = null, signs = [], particles = [], pops = [];
let levelW = 0, killY = 0, startPt = {x:0,y:0};
function buildWorld() {
  platforms = []; gems = []; enemies = []; particles = []; pops = [];
  levelW = LEVEL.widthTiles * TILE;
  killY = -2 * TILE;
  for (const [c,r,w,h] of LEVEL.platforms)
    platforms.push({x:c*TILE, y:r*TILE, w:w*TILE, h:h*TILE});
  for (const [c,r] of LEVEL.gems)
    gems.push({x:(c+0.5)*TILE, y:(r+0.5)*TILE, got:false, t:Math.random()*6});
  for (const [c,r,mn,mx] of LEVEL.enemies)
    enemies.push({x:(c+0.5)*TILE, y:r*TILE+24, hw:18, hh:18, vx:0, vy:0,
                  dir:-1, min:mn*TILE, max:mx*TILE, dead:false, grounded:false, t:Math.random()*6, anim:0});
  goal = {x:(LEVEL.goal.col+0.5)*TILE, y:LEVEL.goal.row*TILE};
  signs = LEVEL.signs.map(([c,r,t]) => ({x:(c+0.5)*TILE, y:r*TILE, text:t}));
  startPt = {x:(LEVEL.start.col+0.5)*TILE, y:LEVEL.start.row*TILE};
}

// ---------- Player ----------
const player = {x:0, y:0, hw:15, hh:30, vx:0, vy:0, face:1, grounded:false,
                lastGround:-1, anim:"idle", t:0, invuln:0};
let score = 0, lives = 3, gemsGot = 0, totalGems = 0;
function resetPlayer() { player.x = startPt.x; player.y = startPt.y; player.vx = 0; player.vy = 0; player.invuln = 0; }

// ---------- Input ----------
const input = {left:false, right:false, jumpAt:-1};
addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD","KeyW"].includes(e.code)) e.preventDefault();
  if (state === "title" || state === "win" || state === "over") { if (e.code==="Space"||e.code==="Enter") startGame(); return; }
  if (e.code==="ArrowLeft"||e.code==="KeyA") input.left = true;
  if (e.code==="ArrowRight"||e.code==="KeyD") input.right = true;
  if (e.code==="ArrowUp"||e.code==="KeyW"||e.code==="Space") input.jumpAt = time;
});
addEventListener("keyup", e => {
  if (e.code==="ArrowLeft"||e.code==="KeyA") input.left = false;
  if (e.code==="ArrowRight"||e.code==="KeyD") input.right = false;
});
function bindBtn(id, on) {
  const el = document.getElementById(id);
  const set = v => ev => { ev.preventDefault();
    if (state!=="play" && v) { startGame(); return; }
    on(v); };
  el.addEventListener("touchstart", set(true), {passive:false});
  el.addEventListener("touchend", set(false), {passive:false});
  el.addEventListener("mousedown", set(true));
  el.addEventListener("mouseup", set(false));
  el.addEventListener("mouseleave", set(false));
}
bindBtn("bleft", v => input.left = v);
bindBtn("bright", v => input.right = v);
bindBtn("bjump", v => { if (v) input.jumpAt = time; });
canvas.addEventListener("pointerdown", () => { if (state!=="play") startGame(); });

// ---------- AABB collision ----------
function overlap(o, p) {
  return o.x-o.hw < p.x+p.w && o.x+o.hw > p.x && o.y-o.hh < p.y+p.h && o.y+o.hh > p.y;
}
function resolveX(o) {
  for (const p of platforms) if (overlap(o, p)) {
    if (o.vx > 0) o.x = p.x - o.hw; else if (o.vx < 0) o.x = p.x + p.w + o.hw;
    o.vx = 0;
  }
}
function resolveY(o) {
  o.grounded = false;
  for (const p of platforms) if (overlap(o, p)) {
    if (o.vy <= 0) { o.y = p.y + p.h + o.hh; o.grounded = true; }  // landed on top
    else { o.y = p.y - o.hh; }                                     // bonked head
    o.vy = 0;
  }
}

// ---------- Update ----------
let state = "title", time = 0, shake = 0, camX = 0, camY = 0, winBonus = 0;
function update(dt) {
  player.t += dt;
  for (const g of gems) g.t += dt;
  for (const e of enemies) e.t += dt;
  if (state !== "play") return;
  if (player.invuln > 0) player.invuln -= dt;

  // horizontal
  const dir = (input.right?1:0) - (input.left?1:0);
  player.vx = dir * MOVE;
  // gravity
  player.vy -= G * dt; if (player.vy < -MAXFALL) player.vy = -MAXFALL;
  // jump (buffer + coyote)
  const canJump = player.grounded || (time - player.lastGround) < COYOTE;
  if (time - input.jumpAt < BUFFER && canJump) {
    player.vy = JUMP; input.jumpAt = -1; player.lastGround = -1; sfx("jump");
    burst(player.x, player.y - player.hh, "#fff", 5, 90);
  }
  // integrate + collide
  player.x += player.vx * dt; resolveX(player);
  player.y += player.vy * dt; resolveY(player);
  if (player.grounded) player.lastGround = time;
  player.x = Math.max(player.hw, Math.min(levelW - player.hw, player.x));
  if (dir > 0) player.face = 1; else if (dir < 0) player.face = -1;
  player.anim = !player.grounded ? "jump" : (dir !== 0 ? "run" : "idle");

  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += 0; e.vy -= G * dt; if (e.vy < -MAXFALL) e.vy = -MAXFALL;
    e.vx = e.dir * 95;
    e.x += e.vx * dt; resolveX(e);
    e.y += e.vy * dt; resolveY(e);
    if (e.x <= e.min) e.dir = 1; else if (e.x >= e.max) e.dir = -1;
  }

  // gem pickups
  for (const g of gems) {
    if (g.got) continue;
    if (Math.abs(g.x - player.x) < player.hw + 14 && Math.abs((g.y) - player.y) < player.hh + 14) {
      g.got = true; gemsGot++; score += GEM_SCORE; sfx("gem");
      burst(g.x, g.y, "#7fe9ff", 10, 140); pop("+" + GEM_SCORE, g.x, g.y, "#7fe9ff");
    }
  }
  // enemy stomp / hurt
  for (const e of enemies) {
    if (e.dead) continue;
    if (overlap(player, {x:e.x-e.hw, y:e.y-e.hh, w:e.hw*2, h:e.hh*2})) {
      const stomp = player.vy < 0 && (player.y - player.hh*0.4) > e.y;
      if (stomp) {
        e.dead = true; player.vy = BOUNCE; score += STOMP_SCORE; sfx("stomp");
        shake = Math.max(shake, 8); burst(e.x, e.y, "#caa06a", 10, 150); pop("+" + STOMP_SCORE, e.x, e.y, "#fff");
      } else if (player.invuln <= 0) {
        lives--; sfx("hurt"); shake = Math.max(shake, 14); player.invuln = 1.3;
        player.vy = 380; player.vx = player.face > 0 ? -260 : 260;
        if (lives <= 0) { gameOver(); return; }
      }
    }
  }
  // goal
  if (Math.abs(goal.x - player.x) < player.hw + 16 && player.y > goal.y - 10 && player.y < goal.y + 120) win();
  // pit
  if (player.y < killY) {
    lives--; sfx("hurt"); shake = Math.max(shake, 10);
    if (lives <= 0) { gameOver(); return; }
    resetPlayer(); player.invuln = 1.3;
  }

  // camera
  const tx = Math.max(VIEW_W/2, Math.min(levelW - VIEW_W/2, player.x));
  const ty = Math.max(180, Math.min(340, player.y + 40));
  camX += (tx - camX) * 0.16; camY += (ty - camY) * 0.16;

  // fx
  for (const p of particles) { p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy -= 200*dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of pops) { p.life -= dt; p.y += 36*dt; }
  pops = pops.filter(p => p.life > 0);
  if (shake > 0.2) shake *= 0.85; else shake = 0;
}

function burst(x, y, color, n, spd) {
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=spd*(0.4+Math.random()*0.6)*0.3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s+30,life:0.45,color}); }
}
function pop(text, x, y, color) { pops.push({text, x, y, color, life:0.7}); }

// ---------- Render ----------
function sx(wx) { return wx - camX + VIEW_W/2 + (shake?rand(-shake,shake):0); }
function sy(wy) { return VIEW_H/2 - (wy - camY) + (shake?rand(-shake,shake):0); }
function rand(a,b){return a+Math.random()*(b-a);}

function drawBackground() {
  const g = ctx.createLinearGradient(0,0,0,VIEW_H);
  g.addColorStop(0,"#5fb0f0"); g.addColorStop(1,"#bfe3fb");
  ctx.fillStyle = g; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  // parallax hills (two bands)
  hills(0.25, 150, "#9ecfa6"); hills(0.5, 95, "#69ab76");
}
function hills(factor, baseH, color) {
  ctx.fillStyle = color;
  const span = 260, off = (camX*factor) % span;
  const yBase = VIEW_H/2 - (3*TILE - camY) + 40;
  ctx.beginPath(); ctx.moveTo(-span, VIEW_H);
  for (let x = -span - off; x < VIEW_W + span; x += span) {
    ctx.quadraticCurveTo(x + span/2, yBase - baseH*0.6, x + span, yBase);
  }
  ctx.lineTo(VIEW_W+span, VIEW_H); ctx.closePath(); ctx.fill();
}
function drawTiles() {
  for (const p of platforms) {
    const cols = Math.round(p.w/TILE), rows = Math.round(p.h/TILE);
    for (let ix=0; ix<cols; ix++) for (let iy=0; iy<rows; iy++) {
      const img = (iy === rows-1) ? IMG.surface : IMG.fill;
      const wx = p.x + ix*TILE, wyTop = p.y + (iy+1)*TILE;
      ctx.drawImage(img, sx(wx), sy(wyTop), TILE, TILE);
    }
  }
}
function drawSigns() {
  for (const s of signs) {
    const x = sx(s.x), yTop = sy(s.y + 2.6*TILE), w = Math.max(96, s.text.length*9 + 22);
    ctx.save(); ctx.translate(x, yTop);
    ctx.fillStyle = "#7a5230"; ctx.fillRect(-5, 0, 10, 2.4*TILE);              // post
    ctx.fillStyle = "#caa46e"; ctx.strokeStyle = "#5e3d1e"; ctx.lineWidth = 3;
    ctx.fillRect(-w/2, -34, w, 30); ctx.strokeRect(-w/2, -34, w, 30);          // board
    ctx.fillStyle = "#3a2a18"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "center";
    ctx.fillText(s.text, 0, -14);
    ctx.restore();
  }
}
function drawGem(g) {
  if (g.got) return;
  const x = sx(g.x), y = sy(g.y) - Math.sin(g.t*2)*4, r = 11, sxw = 1 - Math.abs(Math.sin(g.t*1.6))*0.35;
  ctx.save(); ctx.translate(x,y); ctx.scale(sxw,1);
  ctx.fillStyle = "#3fd6ef"; ctx.beginPath();
  ctx.moveTo(0,-r); ctx.lineTo(r*0.8,-1); ctx.lineTo(0,r); ctx.lineTo(-r*0.8,-1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c8f7ff"; ctx.beginPath();
  ctx.moveTo(0,-r); ctx.lineTo(r*0.4,-2); ctx.lineTo(0,r*0.4); ctx.lineTo(-r*0.4,-2); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawGoal() {
  const x = sx(goal.x), yb = sy(goal.y);
  ctx.fillStyle = "#dcdcdc"; ctx.fillRect(x-2, yb-64, 4, 64);
  const sw = Math.sin(time*2)*2;
  for (let i=0;i<3;i++) for (let j=0;j<2;j++){
    ctx.fillStyle = (i+j)%2 ? "#fff" : "#e8324a";
    ctx.fillRect(x+2+i*8+sw, yb-62+j*8, 8, 8);
  }
}
function drawSprite(frames, idx, wx, wy, face, scale, footPad) {
  const img = frames[idx % frames.length]; if (!img || !img.width) return;
  const w = img.width*scale, h = img.height*scale;
  const x = sx(wx), y = sy(wy);
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
  ctx.drawImage(img, -w/2, -h + footPad, w, h);
  ctx.restore();
}
function drawPlayer() {
  if (player.invuln > 0 && Math.floor(time*12)%2) return;
  let frames, idx, fps;
  if (player.anim === "run") { frames = IMG.anim.run; fps = 14; }
  else if (player.anim === "jump") { frames = IMG.anim.jump; fps = 10; }
  else { frames = IMG.anim.idle; fps = 6; }
  idx = Math.floor(player.t * fps);
  // feet sit at world y = player.y - hh; sprite 68px scaled ~0.9 with bottom padding
  drawSprite(frames, idx, player.x, player.y - player.hh, player.face, 0.92, -6);
}
function drawEnemies() {
  for (const e of enemies) {
    if (e.dead) continue;
    drawSprite(IMG.anim.walk, Math.floor(e.t*8), e.x, e.y - e.hh, e.dir>=0?1:-1, 0.92, -4);
  }
}
function drawParticles() {
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life/0.45);
    ctx.fillStyle = p.color; const s = 5*(p.life/0.45)+1;
    ctx.fillRect(sx(p.x)-s/2, sy(p.y)-s/2, s, s); }
  ctx.globalAlpha = 1;
  ctx.font = "bold 26px system-ui"; ctx.textAlign = "center";
  for (const p of pops) { ctx.globalAlpha = Math.max(0,p.life/0.7); ctx.fillStyle = p.color;
    ctx.fillText(p.text, sx(p.x), sy(p.y)); }
  ctx.globalAlpha = 1;
}
function drawHUD() {
  ctx.textAlign = "left"; ctx.fillStyle = "#fff"; ctx.font = "bold 30px system-ui";
  ctx.fillText("SCORE " + score, 28, 44);
  ctx.fillStyle = "#3fd6ef"; ctx.font = "bold 22px system-ui";
  ctx.fillText("💎 " + gemsGot + "/" + totalGems, 28, 78);
  ctx.textAlign = "right"; ctx.fillStyle = "#ff5b6b"; ctx.font = "26px system-ui";
  ctx.fillText("❤".repeat(Math.max(0,lives)), VIEW_W-24, 46);
  ctx.textAlign = "left";
}
function centerText(lines) {
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.textAlign = "center";
  lines.forEach(l => { ctx.fillStyle = l.c||"#fff"; ctx.font = "bold "+(l.s||34)+"px system-ui";
    ctx.fillText(l.t, VIEW_W/2, VIEW_H/2 + (l.y||0)); });
  ctx.textAlign = "left";
}

function render() {
  drawBackground();
  drawSigns(); drawTiles(); drawGoal();
  for (const g of gems) drawGem(g);
  drawEnemies(); drawPlayer(); drawParticles();
  drawHUD();
  if (state === "title") centerText([
    {t:"CRYSTAL CAPER", s:74, y:-40},
    {t:"a tiny Agile Lens adventure", s:24, y:4, c:"#bfe3fb"},
    {t:"← → move · ↑ / Space jump · stomp the mushrooms · grab the crystals", s:20, y:44, c:"#dfeaff"},
    {t:"Press Space or tap to play", s:24, y:96, c:"#ffe27a"},
  ]);
  if (state === "win") centerText([
    {t:"YOU WIN!", s:84, y:-46},
    {t:"Score "+score+" · Gems "+gemsGot+"/"+totalGems+" · Life bonus +"+winBonus, s:28, y:6},
    {t:"Pip brings the crystals home to Agile Lens HQ.", s:22, y:46, c:"#bfe3fb"},
    {t:"Press Space or tap to play again", s:24, y:96, c:"#ffe27a"},
  ]);
  if (state === "over") centerText([
    {t:"GAME OVER", s:84, y:-30},
    {t:"Score "+score, s:30, y:24},
    {t:"Press Space or tap to retry", s:24, y:84, c:"#ffe27a"},
  ]);
}

// ---------- State transitions ----------
function startGame() {
  buildWorld(); totalGems = gems.length; score = 0; lives = 3; gemsGot = 0;
  resetPlayer(); camX = Math.max(VIEW_W/2, startPt.x); camY = 240;
  state = "play";
}
function win() {
  if (state !== "play") return;
  winBonus = lives * 500; score += winBonus; sfx("win"); state = "win";
  for (let i=0;i<3;i++) burst(player.x, player.y+30, ["#ff7ab3","#ffe27a","#7fe9ff"][i], 14, 220);
}
function gameOver() { state = "over"; }

// ---------- Main loop ----------
let last = 0;
function frame(ts) {
  const dt = last ? Math.min((ts - last)/1000, 1/30) : 0;
  last = ts; time += dt;
  update(dt); render();
  requestAnimationFrame(frame);
}
loadAll(() => { buildWorld(); totalGems = gems.length; resetPlayer(); requestAnimationFrame(frame); });
</script>
</body>
</html>
