<!DOCTYPE html>

  html, body { margin: 0; height: 100%; background: #0e1320; overflow: hidden;

  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
    width: 100%; height: 100%; max-width: 100vw; max-height: 100vh;
    object-fit: contain; background: #6cb8f0; touch-action: none; }
  #pad { position: fixed; inset: 0; pointer-events: none; }
  .btn { position: absolute; bottom: 4vh; width: 17vmin; height: 17vmin; border-radius: 50%;

    color: rgba(255,255,255,.9); pointer-events: auto; -webkit-tap-highlight-color: transparent; }
  .btn:active { background: rgba(255,255,255,.28); }
  #bleft { left: 4vw; } #bright { left: 26vw; }
  #bjump { right: 5vw; width: 21vmin; height: 21vmin; font-size: 4.4vmin; }
  #mute { position: fixed; top: 10px; right: 12px; font-size: 22px; cursor: pointer;
    opacity: .8; pointer-events: auto; background: rgba(0,0,0,.25); border-radius: 8px;
    padding: 2px 8px; z-index: 5; }
  #credit { position: fixed; left: 0; right: 0; bottom: 2px; text-align: center;
    font-size: 11px; color: rgba(255,255,255,.5); pointer-events: auto; }
  #credit a { color: rgba(255,255,255,.7); text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { #pad { display: none; } }
</style>

<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="mute">🔊</div>
<div id="pad">
  <div class="btn" id="bleft">◀</div>
  <div class="btn" id="bright">▶</div>
  <div class="btn" id="bjump">JUMP</div>
</div>
<div id="credit">Crystal Caper — a tiny <a href="https://agilelens.com" target="_blank" rel="noopener">Agile Lens</a> adventure · art generated with PixelLab</div>

<script>
console.log("%c🦊 Crystal Caper","font-size:16px;font-weight:bold");
console.log("Built by Alex Coulombe / Agile Lens — agilelens.com. Every sprite was AI-generated with PixelLab. Each crystal you grab is dedicated to a real Agile Lens client. Press M to mute.");

const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const VIEW_W = canvas.width, VIEW_H = canvas.height;

// ---------- Config (world y-up, origin bottom-left; flipped at render) ----------
const TILE = 40;
const G = 2500, MOVE = 330, JUMP = 900, BOUNCE = 720, MAXFALL = 1500;
const COYOTE = 0.10, BUFFER = 0.12, GEM_SCORE = 100, STOMP_SCORE = 250;

// Each crystal is dedicated to a real Agile Lens client/partner (public-facing names).
// Edit/prune this one array freely — it's just flavor.
const CLIENTS = ["Epic Games","Disney","Royal Caribbean","Skidmore, Owings & Merrill",
  "Royal Shakespeare Company","DBOX","Cesium","Dimensional Innovations","Cooler Screens",
  "Emperia","Dan Fink Studio","Agog","Britt Design Group","Fairworlds"];

// Per-level visual themes (cycle by level). Snow/desert tiles fall back to forest until generated.
const THEMES = [
  { key:"forest", sky:["#5fb0f0","#bfe3fb"], hillFar:"#9ecfa6", hillNear:"#69ab76" },
  { key:"snow",   sky:["#9fc0e0","#e8f1fb"], hillFar:"#cfe0ea", hillNear:"#aebfce" },
  { key:"desert", sky:["#f3b46a","#f8e6c2"], hillFar:"#e0c089", hillNear:"#c79a52" },
];
let theme = THEMES[0];

// Personal-best leaderboard (localStorage; safe in private mode).
function lsGet(k,d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
let bestScore = +lsGet("cc_best_score",0), bestLevel = +lsGet("cc_best_level",1), newBest = false;
function recordBest(){ if (score>bestScore){ bestScore=score; lsSet("cc_best_score",bestScore); newBest=true; }
  if (levelNum>bestLevel){ bestLevel=levelNum; lsSet("cc_best_level",bestLevel); } }
// ?level=N jumps straight to a level (handy for sharing a biome). Guarded for the headless harness.
const urlLevel = (() => { try { return Math.max(1, parseInt(new URLSearchParams(location.search).get("level")) || 1); } catch(e){ return 1; } })();

// ---------- Global leaderboard (shared Cloudflare Worker) ----------
// Empty = board hidden (personal best still shows); nothing breaks pre-deploy.
// After deploying leaderboard/, set DEFAULT_LB to your Worker URL (see leaderboard/README.md).
// ?lb=<url> overrides it for local testing.
const DEFAULT_LB = "";
const LEADERBOARD_URL = (() => { try { return new URLSearchParams(location.search).get("lb"); } catch(e){ return null; } })() || DEFAULT_LB;
let lbTop = [], lbStatus = LEADERBOARD_URL ? "loading" : "off", lbSubmitted = false;
function lbInitials(){
  let n = lsGet("cc_initials","");
  if (!n){ try { n = (prompt("Initials for the leaderboard (3 letters):","") || "").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6); } catch(e){ n=""; }
    if (!n) n = "???"; lsSet("cc_initials", n); }
  return n;
}
function lbFetch(){ if (!LEADERBOARD_URL) return;
  fetch(LEADERBOARD_URL + "/top").then(r=>r.json()).then(d=>{ lbTop = d.top || []; lbStatus = "ok"; }).catch(()=>{ lbStatus = "error"; }); }
function lbSubmit(){ if (!LEADERBOARD_URL || lbSubmitted) return; lbSubmitted = true;
  fetch(LEADERBOARD_URL + "/submit", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name: lbInitials(), score, level: levelNum }) })
    .then(r=>r.json()).then(d=>{ if (d.top) lbTop = d.top; lbStatus = "ok"; }).catch(()=>{ lbStatus = "error"; }); }
function lbLines(max){
  if (!LEADERBOARD_URL) return [];
  if (lbStatus === "loading") return [{t:"GLOBAL BOARD — loading…", s:18, c:"#9af0ff"}];
  if (lbStatus === "error" || lbTop.length === 0) return [{t:"GLOBAL BOARD — post the first score!", s:18, c:"#9af0ff"}];
  const lines = [{t:"— GLOBAL TOP —", s:20, c:"#ffe27a"}];
  lbTop.slice(0, max).forEach((e,i)=> lines.push({t:`${i+1}. ${e.name}  ${e.score}  ·  Lv ${e.level}`, s:18, c:"#dfeaff"}));
  return lines;
}

// ---------- Seeded RNG (mulberry32) ----------
function rng(seed){ let s = seed>>>0; return function(){ s|=0; s=s+0x6D2B79F5|0;
  let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const ri = (r,a,b) => a + Math.floor(r()*(b-a+1));

// ---------- Level 1: hand-authored (with Agile Lens signposts) ----------
const HAND = {
  widthTiles: 66, start:{col:2,row:4}, goal:{col:60,row:3},
  platforms: [[0,0,14,3],[17,0,11,3],[20,6,4,1],[31,0,12,3],[35,6,3,1],[39,8,3,1],[46,0,20,3]],
  gems: [[8,4],[11,4],[20,7],[21,7],[22,7],[23,7],[36,7],[37,7],[40,10],[41,10],[48,4],[50,4],[52,4],[58,4]],
  enemies: [[22,3,18,27],[36,3,32,42],[52,3,47,58]],
  signs: [[5,3,"AGILE LENS →"],[44,3,"agilelens.com"]],
};

// ---------- Procedural level generator (levels 2+) ----------
function genLevel(n){
  const r = rng(7919 + n*101), H = 3, surf = 3;
  const platforms=[], gems=[], enemies=[], signs=[];
  // Jumpability-safe moving descriptor for a floating bonus ledge (range in tiles).
  const mkMove = () => r()<0.5
    ? {axis:"h", range:ri(r,2,3), speed:1.3+r()*0.9, phase:r()*6.2832}
    : {axis:"v", range:1.0+r()*0.7, speed:1.3+r()*0.9, phase:r()*6.2832};
  let w = ri(r,8,10); platforms.push([0,0,w,H]);
  const start = {col:2, row:4};
  let col = w;
  const sections = 5 + Math.min(9, n+2);
  const maxGap = Math.min(5, 2 + (n>>1));
  let enemyBudget = Math.min(2 + n, 11);
  let addedMoving = false;
  for (let i=0;i<sections;i++){
    const gap = ri(r, 2, maxGap); col += gap;
    w = ri(r, 6, 10); platforms.push([col,0,w,H]);
    if (r() < 0.85) gems.push([col - Math.ceil(gap/2), surf+2]);     // arc over the pit
    const ng = ri(r,1,3);
    for (let k=0;k<ng;k++) gems.push([col + ri(r,1,w-2), surf+1]);
    if (r() < 0.5 && w >= 5){                                        // floating bonus ledge
      const fw = ri(r,2,3), fx = col + ri(r,1,Math.max(1,w-fw-1));
      // From level 4 up, some bonus ledges drift and carry the player. Only
      // floating ledges move (never the ground route) so gaps stay ≤5 and
      // clearance ≥3 — jumpability is preserved.
      const mv = (n>=4 && (!addedMoving || r()<0.5)) ? mkMove() : null;
      if (mv) addedMoving = true;
      platforms.push(mv ? [fx,6,fw,1,mv] : [fx,6,fw,1]);
      for (let k=0;k<fw;k++) gems.push([fx+k, 7]);
    }
    if (enemyBudget>0 && r()<0.6 && w>=5){
      const ex = col + ri(r,2,w-3);
      enemies.push([ex, surf, col+1, col+w-2]); enemyBudget--;
    }
    col += w;
  }
  if (n>=4 && !addedMoving){                                         // guarantee one at L4+
    platforms.push([4,6,3,1,{axis:"h",range:2,speed:1.6,phase:0}]);
    for (let k=0;k<3;k++) gems.push([4+k,7]);
  }
  col += ri(r,2,Math.min(4,maxGap)); w = 8; platforms.push([col,0,w,H]);
  const goal = {col: col+w-3, row: surf};
  if (n <= 4) signs.push([4, surf, "agilelens.com"]);
  return {widthTiles: col+w+2, start, goal, platforms, gems, enemies, signs};
}

// ---------- Assets ----------
const IMG = {}, SFX = {};
const manifest = {
  idle: ["pip_idle_0","pip_idle_1","pip_idle_2","pip_idle_3"],
  run:  ["pip_run_0","pip_run_1","pip_run_2","pip_run_3","pip_run_4","pip_run_5"],
  jump: ["pip_jump_2","pip_jump_4","pip_jump_6"],
  walk: ["grump_walk_0","grump_walk_1","grump_walk_2","grump_walk_3","grump_walk_4","grump_walk_5"],
};
function loadAll(done){
  const tiles = ["tile_surface","tile_fill","tile_surface_snow","tile_fill_snow","tile_surface_desert","tile_fill_desert"];
  const names = [...new Set(Object.values(manifest).flat()), ...tiles];
  let pending = names.length; const byName = {};
  names.forEach(n => { const im = new Image();
    im.onload = im.onerror = () => { if (--pending===0) wire(); }; im.src = "assets/"+n+".png"; byName[n]=im; });
  function wire(){
    IMG.anim = {}; for (const k in manifest) IMG.anim[k] = manifest[k].map(n=>byName[n]);
    const ok = im => im && im.naturalWidth > 0;
    const fS = byName["tile_surface"], fF = byName["tile_fill"];
    const pick = (n,fb) => ok(byName[n]) ? byName[n] : fb;
    IMG.tiles = {
      forest: { surface:fS, fill:fF },
      snow:   { surface:pick("tile_surface_snow",fS),   fill:pick("tile_fill_snow",fF) },
      desert: { surface:pick("tile_surface_desert",fS), fill:pick("tile_fill_desert",fF) },
    };
    ["sfx_jump","sfx_gem","sfx_stomp","sfx_hurt","sfx_win"].forEach(s => { SFX[s]=new Audio("assets/"+s+".wav"); SFX[s].preload="auto"; });
    done();
  }
}
function sfx(name){ if (muted) return; const a=SFX["sfx_"+name]; if(!a) return;
  try{ const c=a.cloneNode(); c.volume=0.45; c.play().catch(()=>{}); }catch(e){} }

// ---------- Music ----------
const music = new Audio("assets/music.wav"); music.loop = true; music.volume = 0.32;
let muted = false;
function startMusic(){ if (!muted) music.play().catch(()=>{}); }
function toggleMute(){ muted = !muted; document.getElementById("mute").textContent = muted ? "🔇" : "🔊";
  if (muted) music.pause(); else music.play().catch(()=>{}); }
document.getElementById("mute").addEventListener("click", e => { e.stopPropagation(); toggleMute(); });

// ---------- World ----------
let platforms=[], gems=[], enemies=[], goal=null, signs=[], particles=[], pops=[];
let levelW=0, killY=0, startPt={x:0,y:0}, totalGems=0, allGemsFired=false, fireworksT=0;
let boss=null, bossProjectiles=[];   // "King Grumpcap" caps every 5th level (gates the goal)
function buildWorld(def){
  platforms=[]; gems=[]; enemies=[]; particles=[]; pops=[]; allGemsFired=false; fireworksT=0;
  levelW = def.widthTiles*TILE; killY = -2*TILE;
  for (const pd of def.platforms){ const [c,r,w,h,mv] = pd;
    const p = {x:c*TILE,y:r*TILE,w:w*TILE,h:h*TILE};
    if (mv){ p.mv = {axis:mv.axis, range:mv.range*TILE, speed:mv.speed, phase:mv.phase, baseX:c*TILE, baseY:r*TILE}; p.mvdx=0; p.mvdy=0; }
    platforms.push(p); }
  for (const [c,r] of def.gems) gems.push({x:(c+0.5)*TILE,y:(r+0.5)*TILE,got:false,t:Math.random()*6});
  for (const [c,r,mn,mx] of def.enemies) enemies.push({x:(c+0.5)*TILE,y:r*TILE+24,hw:18,hh:18,vx:0,vy:0,dir:-1,min:mn*TILE,max:mx*TILE,dead:false,grounded:false,t:Math.random()*6});
  goal = {x:(def.goal.col+0.5)*TILE, y:def.goal.row*TILE};
  signs = def.signs.map(([c,r,t]) => ({x:(c+0.5)*TILE, y:r*TILE, text:t}));
  startPt = {x:(def.start.col+0.5)*TILE, y:def.start.row*TILE};
  totalGems = gems.length;
  // Boss on every 5th level: spawn on the ground platform under the goal; the goal
  // is gated (hidden + non-triggering) until it falls. Mirrors the iOS build.
  boss = null; bossProjectiles = [];
  if (levelNum % 5 === 0){
    let amin = goal.x - 5*TILE, amax = goal.x + TILE;
    for (const p of platforms){ if (p.h>=3*TILE && p.x<=goal.x && goal.x<=p.x+p.w){ amin=p.x+44; amax=p.x+p.w-44; } }
    boss = {x:Math.min(amax, goal.x-1.5*TILE), y:def.goal.row*TILE+50, hw:44, hh:50, vx:0, vy:0,
            hp:3, state:"idle", st:0, face:-1, cycle:0, invuln:0, dead:false,
            arenaMin:amin, arenaMax:amax, flash:0, anim:0};
  }
}

const player = {x:0,y:0,hw:15,hh:30,vx:0,vy:0,face:1,grounded:false,lastGround:-1,anim:"idle",t:0,invuln:0,ground:null};
let score=0, lives=3, gemsGot=0, levelNum=1, clientIdx=0, levelBonus=0, levelFlash=0;
function resetPlayer(){ player.x=startPt.x; player.y=startPt.y; player.vx=0; player.vy=0; player.invuln=0; }

// ---------- Input ----------
const input = {left:false,right:false,jumpAt:-1};
addEventListener("keydown", e => {
  if (e.code==="KeyM"){ toggleMute(); return; }
  if (["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD","KeyW"].includes(e.code)) e.preventDefault();
  if (state!=="play"){ if (e.code==="Space"||e.code==="Enter") advance(); return; }
  if (e.code==="ArrowLeft"||e.code==="KeyA") input.left=true;
  if (e.code==="ArrowRight"||e.code==="KeyD") input.right=true;
  if (e.code==="ArrowUp"||e.code==="KeyW"||e.code==="Space") input.jumpAt=time;
});
addEventListener("keyup", e => {
  if (e.code==="ArrowLeft"||e.code==="KeyA") input.left=false;
  if (e.code==="ArrowRight"||e.code==="KeyD") input.right=false;
});
function bindBtn(id,on){ const el=document.getElementById(id);
  const set=v=>ev=>{ ev.preventDefault(); if (state!=="play"&&v){ advance(); return; } on(v); };
  el.addEventListener("touchstart",set(true),{passive:false}); el.addEventListener("touchend",set(false),{passive:false});
  el.addEventListener("mousedown",set(true)); el.addEventListener("mouseup",set(false)); el.addEventListener("mouseleave",set(false)); }
bindBtn("bleft",v=>input.left=v); bindBtn("bright",v=>input.right=v); bindBtn("bjump",v=>{ if(v) input.jumpAt=time; });
canvas.addEventListener("pointerdown", () => { if (state!=="play") advance(); });

// ---------- Collision ----------
function overlap(o,p){ return o.x-o.hw<p.x+p.w && o.x+o.hw>p.x && o.y-o.hh<p.y+p.h && o.y+o.hh>p.y; }
function resolveX(o){ for (const p of platforms) if (overlap(o,p)){ if (o.vx>0) o.x=p.x-o.hw; else if (o.vx<0) o.x=p.x+p.w+o.hw; o.vx=0; } }
function resolveY(o){ o.grounded=false; o.ground=null; for (const p of platforms) if (overlap(o,p)){ if (o.vy<=0){ o.y=p.y+p.h+o.hh; o.grounded=true; o.ground=p; } else o.y=p.y-o.hh; o.vy=0; } }

// ---------- Update ----------
let state="title", time=0, shake=0, camX=0, camY=0;
function update(dt){
  player.t += dt; for (const g of gems) g.t+=dt; for (const e of enemies) e.t+=dt;
  if (levelFlash>0) levelFlash-=dt;
  if (fireworksT>0){ fireworksT-=dt;
    if (Math.random()<0.5) burst(camX+rand(-VIEW_W/2,VIEW_W/2), camY+rand(0,VIEW_H/2), `hsl(${(Math.random()*360)|0},90%,65%)`, 16, 240); }
  if (state!=="play") return;
  // Moving platforms: advance to a deterministic sinusoid, record per-frame delta,
  // and carry a player still resting on one (mirrors the iOS manual-gravity carry).
  for (const p of platforms){ if (!p.mv) continue;
    const off = Math.sin(time*p.mv.speed + p.mv.phase) * p.mv.range;
    const nx = p.mv.axis==="h" ? p.mv.baseX+off : p.mv.baseX;
    const ny = p.mv.axis==="v" ? p.mv.baseY+off : p.mv.baseY;
    p.mvdx = nx-p.x; p.mvdy = ny-p.y; p.x = nx; p.y = ny; }
  if (player.ground && player.ground.mv && player.grounded){ player.x += player.ground.mvdx; player.y += player.ground.mvdy; }
  if (player.invuln>0) player.invuln-=dt;

  const dir=(input.right?1:0)-(input.left?1:0); player.vx=dir*MOVE;
  player.vy -= G*dt; if (player.vy<-MAXFALL) player.vy=-MAXFALL;
  const canJump = player.grounded || (time-player.lastGround)<COYOTE;
  if (time-input.jumpAt<BUFFER && canJump){ player.vy=JUMP; input.jumpAt=-1; player.lastGround=-1; sfx("jump"); burst(player.x,player.y-player.hh,"#fff",5,90); }
  player.x += player.vx*dt; resolveX(player);
  player.y += player.vy*dt; resolveY(player);
  if (player.grounded) player.lastGround=time;
  player.x = Math.max(player.hw, Math.min(levelW-player.hw, player.x));
  if (dir>0) player.face=1; else if (dir<0) player.face=-1;
  player.anim = !player.grounded ? "jump" : (dir!==0?"run":"idle");

  for (const e of enemies){ if (e.dead) continue;
    e.vy-=G*dt; if (e.vy<-MAXFALL) e.vy=-MAXFALL; e.vx=e.dir*95;
    e.x+=e.vx*dt; resolveX(e); e.y+=e.vy*dt; resolveY(e);
    if (e.x<=e.min) e.dir=1; else if (e.x>=e.max) e.dir=-1; }

  for (const g of gems){ if (g.got) continue;
    if (Math.abs(g.x-player.x)<player.hw+14 && Math.abs(g.y-player.y)<player.hh+14){
      g.got=true; gemsGot++; score+=GEM_SCORE; sfx("gem");
      burst(g.x,g.y,"#7fe9ff",10,140);
      pop("💎 " + CLIENTS[clientIdx++ % CLIENTS.length], g.x, g.y, "#9af0ff", 22);
      if (gemsGot===totalGems && totalGems>0 && !allGemsFired) allCrystals();
    } }

  for (const e of enemies){ if (e.dead) continue;
    if (overlap(player,{x:e.x-e.hw,y:e.y-e.hh,w:e.hw*2,h:e.hh*2})){
      const stomp = player.vy<0 && (player.y-player.hh*0.4)>e.y;
      if (stomp){ e.dead=true; player.vy=BOUNCE; score+=STOMP_SCORE; sfx("stomp"); shake=Math.max(shake,8);
        burst(e.x,e.y,"#caa06a",10,150); pop("+"+STOMP_SCORE,e.x,e.y,"#fff",26); }
      else if (player.invuln<=0){ lives--; sfx("hurt"); shake=Math.max(shake,14); player.invuln=1.3;
        player.vy=380; player.vx=player.face>0?-260:260; if (lives<=0){ gameOver(); return; } } } }

  updateBoss(dt);
  if (!boss && Math.abs(goal.x-player.x)<player.hw+16 && player.y>goal.y-10 && player.y<goal.y+120) levelClear();
  if (player.y<killY){ lives--; sfx("hurt"); shake=Math.max(shake,10); if (lives<=0){ gameOver(); return; } resetPlayer(); player.invuln=1.3; }

  const tx=Math.max(VIEW_W/2,Math.min(levelW-VIEW_W/2,player.x)), ty=Math.max(180,Math.min(340,player.y+40));
  camX+=(tx-camX)*0.16; camY+=(ty-camY)*0.16;

  for (const p of particles){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy-=200*dt; }
  particles=particles.filter(p=>p.life>0);
  for (const p of pops){ p.life-=dt; p.y+=34*dt; } pops=pops.filter(p=>p.life>0);
  if (shake>0.2) shake*=0.85; else shake=0;
}
function burst(x,y,c,n,spd){ for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=spd*(0.4+Math.random()*0.6)*0.3;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s+30,life:0.5,color:c}); } }
function pop(text,x,y,color,size){ pops.push({text,x,y,color,size:size||24,life:0.85}); }
function allCrystals(){ allGemsFired=true; fireworksT=1.7; score+=500; shake=Math.max(shake,6);
  pop("ALL CRYSTALS!  +500", player.x, player.y+70, "#ffe27a", 34); }

// ---------- Boss (every 5th level) ----------
function updateBoss(dt){
  // Slow lobbed spores: gentle gravity, dodgeable, hurt on contact.
  for (let i=bossProjectiles.length-1;i>=0;i--){ const q=bossProjectiles[i];
    q.vy -= G*0.45*dt; q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt;
    if (q.y<killY || q.life<=0){ bossProjectiles.splice(i,1); continue; }
    if (Math.abs(q.x-player.x)<player.hw+12 && Math.abs(q.y-player.y)<player.hh+12){ bossProjectiles.splice(i,1);
      if (player.invuln<=0){ lives--; sfx("hurt"); shake=Math.max(shake,12); player.invuln=1.3;
        player.vy=360; player.vx=player.face>0?-240:240; if (lives<=0){ gameOver(); return; } } } }
  if (!boss || boss.dead) return;
  boss.anim += dt; if (boss.flash>0) boss.flash-=dt; if (boss.invuln>0) boss.invuln-=dt;
  boss.vy -= G*dt; if (boss.vy<-MAXFALL) boss.vy=-MAXFALL;
  boss.st += dt;
  const idleD=1.3, teleD=0.7, chgD=0.75, recD=1.0;   // telegraph → charge / projectile → recover
  if (boss.state==="idle"){ boss.face = player.x<boss.x?-1:1; boss.vx = boss.face*35;
    if (boss.st>=idleD){ boss.state="telegraph"; boss.st=0; } }
  else if (boss.state==="telegraph"){ boss.vx=0; boss.face = player.x<boss.x?-1:1;
    if (boss.st>=teleD){ boss.st=0; if (boss.cycle%2===1){ fireBossProjectile(); boss.state="recover"; }
      else boss.state="charge"; boss.cycle++; } }
  else if (boss.state==="charge"){ boss.vx = boss.face*360; if (boss.st>=chgD){ boss.state="recover"; boss.st=0; } }
  else { boss.vx = boss.face*18; if (boss.st>=recD){ boss.state="idle"; boss.st=0; } }
  boss.x += boss.vx*dt; resolveX(boss); boss.y += boss.vy*dt; resolveY(boss);
  if (boss.x<=boss.arenaMin){ boss.x=boss.arenaMin; if (boss.state==="charge") boss.face=1; }
  else if (boss.x>=boss.arenaMax){ boss.x=boss.arenaMax; if (boss.state==="charge") boss.face=-1; }
  if (overlap(player,{x:boss.x-boss.hw,y:boss.y-boss.hh,w:boss.hw*2,h:boss.hh*2})){
    const stomp = player.vy<0 && (player.y-player.hh*0.4)>boss.y;
    if (stomp){ player.vy=BOUNCE;
      if (boss.invuln<=0){ boss.hp--; boss.invuln=0.6; boss.flash=0.18; sfx("stomp"); shake=Math.max(shake,10);
        burst(boss.x,boss.y,"#fff",12,200);
        if (boss.hp<=0) defeatBoss(); else pop("HIT!",boss.x,boss.y+70,"#fff",26); } }
    else if (player.invuln<=0){ lives--; sfx("hurt"); shake=Math.max(shake,14); player.invuln=1.3;
      player.vy=380; player.vx=player.face>0?-260:260; if (lives<=0){ gameOver(); return; } } }
}
function fireBossProjectile(){ const dir = player.x>=boss.x?1:-1;
  bossProjectiles.push({x:boss.x+boss.face*42, y:boss.y+6, vx:dir*230, vy:230, life:4}); }
function defeatBoss(){ score+=1500; shake=Math.max(shake,16); sfx("win");
  pop("KING GRUMPCAP DOWN!  +1500", boss.x, boss.y+70, "#ffe27a", 30);
  pop("THE GOAL IS OPEN!", goal.x, goal.y+170, "#7fe9ff", 24);
  fireworksT=1.7; boss=null; bossProjectiles=[]; }

// ---------- Render ----------
function sx(wx){ return wx-camX+VIEW_W/2 + (shake?rand(-shake,shake):0); }
function sy(wy){ return VIEW_H/2-(wy-camY) + (shake?rand(-shake,shake):0); }
function rand(a,b){ return a+Math.random()*(b-a); }
function drawBackground(){ const g=ctx.createLinearGradient(0,0,0,VIEW_H);
  g.addColorStop(0,theme.sky[0]); g.addColorStop(1,theme.sky[1]); ctx.fillStyle=g; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  hills(0.25,150,theme.hillFar); hills(0.5,95,theme.hillNear); }
function hills(factor,baseH,color){ ctx.fillStyle=color; const span=260, off=(camX*factor)%span, yBase=VIEW_H/2-(3*TILE-camY)+40;
  ctx.beginPath(); ctx.moveTo(-span,VIEW_H);
  for (let x=-span-off;x<VIEW_W+span;x+=span) ctx.quadraticCurveTo(x+span/2,yBase-baseH*0.6,x+span,yBase);
  ctx.lineTo(VIEW_W+span,VIEW_H); ctx.closePath(); ctx.fill(); }
function drawTiles(){ const T=IMG.tiles[theme.key]||IMG.tiles.forest;
  for (const p of platforms){ const cols=Math.round(p.w/TILE), rows=Math.round(p.h/TILE);
  for (let ix=0;ix<cols;ix++) for (let iy=0;iy<rows;iy++){ const img=(iy===rows-1)?T.surface:T.fill;
    ctx.drawImage(img, sx(p.x+ix*TILE), sy(p.y+(iy+1)*TILE), TILE, TILE); } } }
function drawSigns(){ for (const s of signs){ const x=sx(s.x), yTop=sy(s.y+2.6*TILE), w=Math.max(96,s.text.length*9+22);
  ctx.save(); ctx.translate(x,yTop);
  ctx.fillStyle="#7a5230"; ctx.fillRect(-5,0,10,2.4*TILE);
  ctx.fillStyle="#caa46e"; ctx.strokeStyle="#5e3d1e"; ctx.lineWidth=3; ctx.fillRect(-w/2,-34,w,30); ctx.strokeRect(-w/2,-34,w,30);
  ctx.fillStyle="#3a2a18"; ctx.font="bold 15px system-ui"; ctx.textAlign="center"; ctx.fillText(s.text,0,-14); ctx.restore(); } }
function drawGem(g){ if (g.got) return; const x=sx(g.x), y=sy(g.y)-Math.sin(g.t*2)*4, r=11, w=1-Math.abs(Math.sin(g.t*1.6))*0.35;
  ctx.save(); ctx.translate(x,y); ctx.scale(w,1);
  ctx.fillStyle="#3fd6ef"; ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*0.8,-1); ctx.lineTo(0,r); ctx.lineTo(-r*0.8,-1); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#c8f7ff"; ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*0.4,-2); ctx.lineTo(0,r*0.4); ctx.lineTo(-r*0.4,-2); ctx.closePath(); ctx.fill(); ctx.restore(); }
function drawGoal(){ if (boss) return;   // gated behind the boss on milestone levels
  const x=sx(goal.x), yb=sy(goal.y); ctx.fillStyle="#dcdcdc"; ctx.fillRect(x-2,yb-64,4,64);
  const sw=Math.sin(time*2)*2; for (let i=0;i<3;i++) for (let j=0;j<2;j++){ ctx.fillStyle=(i+j)%2?"#fff":"#e8324a"; ctx.fillRect(x+2+i*8+sw,yb-62+j*8,8,8); } }
function drawSprite(frames,idx,wx,wy,face,scale,foot){ const img=frames[idx%frames.length]; if (!img||!img.width) return;
  const w=img.width*scale, h=img.height*scale, x=sx(wx), y=sy(wy);
  ctx.save(); ctx.translate(x,y); ctx.scale(face,1); ctx.drawImage(img,-w/2,-h+foot,w,h); ctx.restore(); }
function drawPlayer(){ if (player.invuln>0 && Math.floor(time*12)%2) return;
  let frames,fps; if (player.anim==="run"){ frames=IMG.anim.run; fps=14; } else if (player.anim==="jump"){ frames=IMG.anim.jump; fps=10; } else { frames=IMG.anim.idle; fps=6; }
  drawSprite(frames, Math.floor(player.t*fps), player.x, player.y-player.hh, player.face, 0.92, -6); }
function drawEnemies(){ for (const e of enemies){ if (e.dead) continue; drawSprite(IMG.anim.walk, Math.floor(e.t*8), e.x, e.y-e.hh, e.dir>=0?1:-1, 0.92, -4); } }
function drawBoss(){
  for (const q of bossProjectiles){ const x=sx(q.x), y=sy(q.y);
    ctx.fillStyle="#9e4cd6"; ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#d9aef6"; ctx.beginPath(); ctx.arc(x-2,y-2,3,0,Math.PI*2); ctx.fill(); }
  if (!boss) return;
  const x=sx(boss.x), y=sy(boss.y), w=boss.hw*2, h=boss.hh*2;
  const flashing = boss.state==="telegraph" ? (Math.sin(boss.anim*22)>0) : boss.flash>0;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="#ece0bd"; ctx.fillRect(-w*0.22,h*0.4,w*0.16,h*0.1); ctx.fillRect(w*0.06,h*0.4,w*0.16,h*0.1); // feet
  ctx.fillStyle="#565c6b"; ctx.beginPath(); ctx.arc(-w*0.36,0,w*0.12,0,Math.PI*2); ctx.arc(w*0.36,0,w*0.12,0,Math.PI*2); ctx.fill(); // arms
  ctx.fillStyle="#ece0bd"; ctx.fillRect(-w*0.26,-h*0.04,w*0.52,h*0.44); // stem
  ctx.fillStyle="#565c6b"; ctx.fillRect(-w*0.2,h*0.02,w*0.4,h*0.24); // chest plate
  ctx.fillStyle="#3d4250"; ctx.fillRect(-w*0.04,h*0.02,w*0.08,h*0.24);
  ctx.fillStyle = flashing ? "#ff5a6a" : "#94202f"; // cap
  ctx.beginPath(); ctx.ellipse(0,-h*0.18,w*0.54,h*0.3,0,0,Math.PI*2); ctx.fill();
  ctx.fillRect(-w*0.54,-h*0.18,w*1.08,h*0.1);
  ctx.fillStyle="#f7e6c8"; for (const s of [[-0.26,-0.24,7],[0.24,-0.22,6],[0,-0.32,5]]){ ctx.beginPath(); ctx.arc(w*s[0],h*s[1],s[2],0,Math.PI*2); ctx.fill(); } // spots
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(-w*0.13,-h*0.02,6,0,Math.PI*2); ctx.arc(w*0.13,-h*0.02,6,0,Math.PI*2); ctx.fill(); // eyes
  ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(-w*0.13+boss.face*1.5,-h*0.02,3,0,Math.PI*2); ctx.arc(w*0.13+boss.face*1.5,-h*0.02,3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#5e0f18"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-w*0.2,-h*0.08); ctx.lineTo(-w*0.06,-h*0.02); ctx.moveTo(w*0.2,-h*0.08); ctx.lineTo(w*0.06,-h*0.02); ctx.stroke(); // brows
  ctx.fillStyle="#f5cb38"; ctx.fillRect(-w*0.17,-h*0.5,w*0.34,h*0.08); // crown
  for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*w*0.14-5,-h*0.5); ctx.lineTo(i*w*0.14,-h*0.64); ctx.lineTo(i*w*0.14+5,-h*0.5); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle="#3fd6ef"; ctx.beginPath(); ctx.arc(0,-h*0.46,3,0,Math.PI*2); ctx.fill();
  ctx.restore();
  for (let i=0;i<3;i++){ ctx.fillStyle = i<boss.hp ? "#ff5b6b" : "rgba(255,255,255,.18)"; ctx.fillRect(x-22+i*16, sy(boss.y)-h*0.5-24, 11, 11); } // HP pips
}
function drawFx(){ for (const p of particles){ ctx.globalAlpha=Math.max(0,p.life/0.5); ctx.fillStyle=p.color; const s=5*(p.life/0.5)+1; ctx.fillRect(sx(p.x)-s/2,sy(p.y)-s/2,s,s); }
  ctx.globalAlpha=1; ctx.textAlign="center";
  for (const p of pops){ ctx.globalAlpha=Math.max(0,p.life/0.85); ctx.font="bold "+p.size+"px system-ui";
    ctx.lineWidth=4; ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.strokeText(p.text,sx(p.x),sy(p.y)); ctx.fillStyle=p.color; ctx.fillText(p.text,sx(p.x),sy(p.y)); }
  ctx.globalAlpha=1; ctx.textAlign="left"; }
function drawHUD(){ ctx.textAlign="left"; ctx.fillStyle="#fff"; ctx.font="bold 30px system-ui"; ctx.fillText("SCORE "+score,28,44);
  ctx.fillStyle="#3fd6ef"; ctx.font="bold 22px system-ui"; ctx.fillText("💎 "+gemsGot+"/"+totalGems,28,78);
  ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font="bold 24px system-ui"; ctx.fillText("LEVEL "+levelNum, VIEW_W/2, 40);
  ctx.textAlign="right"; ctx.fillStyle="#ff5b6b"; ctx.font="26px system-ui"; ctx.fillText("❤".repeat(Math.max(0,lives)), VIEW_W-58,46); ctx.textAlign="left";
  if (levelFlash>0){ ctx.globalAlpha=Math.min(1,levelFlash); ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font="bold 70px system-ui";
    ctx.fillText("LEVEL "+levelNum, VIEW_W/2, VIEW_H/2-10); ctx.globalAlpha=1; ctx.textAlign="left"; } }
function centerText(lines){ ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(0,0,VIEW_W,VIEW_H); ctx.textAlign="center";
  lines.forEach(l => { ctx.fillStyle=l.c||"#fff"; ctx.font="bold "+(l.s||34)+"px system-ui"; ctx.fillText(l.t, VIEW_W/2, VIEW_H/2+(l.y||0)); }); ctx.textAlign="left"; }
// Global leaderboard panel (top-left) on the title + game-over screens. Hidden when no URL is set.
function drawLbPanel(){ const lines = lbLines(8); if (!lines.length) return;
  ctx.textAlign="left"; let y = 96;
  for (const l of lines){ ctx.fillStyle = l.c || "#fff"; ctx.font = "bold "+(l.s||16)+"px system-ui"; ctx.fillText(l.t, 30, y); y += (l.s||16) + 9; }
  ctx.textAlign="left"; }
function render(){
  drawBackground(); drawSigns(); drawTiles(); drawGoal();
  for (const g of gems) drawGem(g); drawEnemies(); drawBoss(); drawPlayer(); drawFx(); drawHUD();
  if (state==="title") centerText([{t:"CRYSTAL CAPER",s:72,y:-54},{t:"a tiny Agile Lens adventure",s:24,y:-12,c:"#bfe3fb"},
    {t:"← → move · ↑ / Space jump · stomp mushrooms · grab every crystal",s:20,y:28,c:"#dfeaff"},
    {t:"endless levels · forest · snow · desert",s:20,y:60,c:"#dfeaff"},
    {t:"Best: "+bestScore+" · reached level "+bestLevel,s:20,y:94,c:"#9af0ff"},
    {t:"▶ Press Space or tap to play",s:24,y:132,c:"#ffe27a"}]);
  if (state==="clear") centerText([{t:"LEVEL "+levelNum+" COMPLETE!",s:64,y:-46},
    {t:"Score "+score+" · Gems "+gemsGot+"/"+totalGems+" · Life bonus +"+levelBonus,s:26,y:6},
    {t:"Pip delivers the crystals to Agile Lens HQ.",s:22,y:44,c:"#bfe3fb"},
    {t:"Press Space or tap for level "+(levelNum+1),s:24,y:96,c:"#ffe27a"}]);
  if (state==="over") centerText([{t:"GAME OVER",s:82,y:-40},{t:"Reached level "+levelNum+" · Score "+score,s:28,y:8},
    {t: newBest ? "★ NEW PERSONAL BEST! ★" : "Best: "+bestScore+" · level "+bestLevel, s:26, y:46, c: newBest?"#ffe27a":"#9af0ff"},
    {t:"Press Space or tap to start over",s:24,y:90,c:"#ffe27a"}]);
  if (state==="title" || state==="over") drawLbPanel();
}

// ---------- Flow ----------
function startLevel(){ theme = THEMES[(levelNum-1) % THEMES.length]; buildWorld(levelNum===1 ? HAND : genLevel(levelNum));
  gemsGot=0; lives=3; resetPlayer(); camX=Math.max(VIEW_W/2,startPt.x); camY=240; levelFlash=1.4; state="play"; startMusic(); }
function levelClear(){ if (state!=="play") return; levelBonus=lives*500; score+=levelBonus; sfx("win"); recordBest(); state="clear";
  for (let i=0;i<3;i++) burst(player.x,player.y+30,["#ff7ab3","#ffe27a","#7fe9ff"][i],14,220); }
function gameOver(){ recordBest(); lbSubmit(); state="over"; }
function advance(){
  newBest=false;
  if (state==="title"){ levelNum=urlLevel; score=0; clientIdx=0; lbSubmitted=false; lbFetch(); startLevel(); }
  else if (state==="clear"){ levelNum++; startLevel(); }
  else if (state==="over"){ levelNum=urlLevel; score=0; clientIdx=0; lbSubmitted=false; lbFetch(); startLevel(); }
}

let last=0;
function frame(ts){ const dt=last?Math.min((ts-last)/1000,1/30):0; last=ts; time+=dt; update(dt); render(); requestAnimationFrame(frame); }
loadAll(() => { buildWorld(HAND); resetPlayer(); lbFetch(); requestAnimationFrame(frame); });
</script>
</body>
